<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <!--
      Need a visual blank slate?
      Remove all code in `styles.css`!
    -->
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <header class="header">
      <h1 class="logo">E-commerce</h1>
      <nav class="nav">
        <a href="#" class="nav-pill">Home</a>
        <a href="#" class="nav-pill active">Products</a>
        <a href="#" class="nav-pill">Cart</a>
      </nav>
    </header>
    <main>
      <section id="filters">
        <h2>Our Range of Products</h2>
        <div>
          <select id="gender-selection">
            <option value="">-- Gender --</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <input type="text" id="searchInput" placeholder="Search..." />
      </section>
      <div class="products-filters">
        <section id="filters-tab">
          <h2 class="filter-head">Filters</h2>
          <br />
          <h3 class="filter-head">Gender</h3>
          <br />
          <label>
            <input type="radio" name="gender" value="male" /> Male
          </label>
          <br />
          <label>
            <input type="radio" name="gender" value="female" /> Female
          </label>
          <br />
          <h3 class="filter-head">Rating ⭐</h3>
          <br />
          <input
            id="rating-input"
            type="range"
            min="0"
            max="5"
            step="0.5"
            value="0"
          />
          <br />
          <p>Greater than: <span id="rating-value">0</span></p>
          <br />
          <h3 class="filter-head">Category</h3>
          <br />
          <label>
            <input type="checkbox" class="category-checkbox" value="Formal" />
            Formal
          </label>
          <br />

          <label>
            <input type="checkbox" class="category-checkbox" value="Casual" />
            Casual
          </label>
          <br />
          <label>
            <input
              type="checkbox"
              class="category-checkbox"
              value="Semi-Casual"
            />
            Semi-Casual
          </label>
          <br />

          <label>
            <input
              type="checkbox"
              class="category-checkbox"
              value="Party-wear"
            />
            Party-wear
          </label>
          <br />

          <label>
            <input
              type="checkbox"
              class="category-checkbox"
              value="Sportswear"
            />
            Sportswear
          </label>
          <br />
          <button id="clear-btn" class="product-button">Clear</button>
        </section>

        <section id="productsDisplay"></section>
      </div>
    </main>
  </body>
</html>
